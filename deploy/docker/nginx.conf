daemon off;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    keepalive_timeout 60;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/csv image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=10m use_temp_path=off;

    upstream app_server {
        server 127.0.0.1:8000 fail_timeout=0;
    }

    server {
        listen 8042;
        server_name localhost;
        charset utf-8;
        root /app/web;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://app_server;
        }

        location /vendor/ {
            expires 1y;
        }

        location ~* \.(js|css)$ {
            expires -1;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}

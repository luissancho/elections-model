<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_title }} · {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/dist/css/site.css">
  <script defer src="/dist/vendor/echarts-5.6.0.min.js"></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  {% if manifest.freeze.active %}
  <div id="freeze-banner">{{ manifest.freeze.message or 'Publicación congelada.' }}</div>
  {% endif %}
  {% include '_header.html' +%}
  <main id="main">
    <p class="status" id="status" hidden></p>
    {% block content %}{% endblock %}
  </main>
  {% include '_footer.html' +%}
  {% if initial is defined %}
  <script type="application/json" id="initial-data">{{ initial|tojson }}</script>
  {% endif %}
</body>
</html>

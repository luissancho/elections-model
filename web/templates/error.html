<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_title }} · Error {{ status }}</title>
  <meta name="description" content="{{ site_title }}: {{ site_tagline|lower }} en España.">
  {% include '_icons.html' +%}
  <link rel="stylesheet" href="/dist/css/site.css">
</head>
<body>
  <header id="site-header">
    {% include '_brand.html' +%}
  </header>
  <main id="main">
    <section class="card">
      <p class="status error">{{ message }}</p>
      <p class="muted">Error {{ status }} · <a href="/">Volver al inicio</a></p>
    </section>
  </main>
</body>
</html>
